global:
  namespace: ai-gateway
  imagePullSecrets: []
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

istio:
  enabled: true
  gateway: "ai-gateway-gateway"
  hosts:
    - "*"

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/klxhunter42/ai-gateway
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "2"
  env:
    GLOBAL_RATE_LIMIT: "100"
    AGENT_RATE_LIMIT: "5"
    UPSTREAM_URL: "https://api.z.ai/api/anthropic"
    GLM_MODE: "false"
    SERVER_PORT: ":8080"
    OAUTH_CALLBACK_BASE: ""
    WORKER_POOL_SIZE: "100"
    REDIS_POOL_SIZE: "50"
    REDIS_MIN_IDLE_CONNS: "10"
    STREAM_TIMEOUT: "300s"
    PASTEGUARD_ENABLED: "true"
    PASTEGUARD_PII_ENABLED: "true"
    UPSTREAM_MAX_RETRIES: "20"
    UPSTREAM_RETRY_BACKOFF: "2s"
    TRANSIENT_RETRY_MAX: "10"
    CLI_SIDECAR_ENABLED: "true"
    CLI_SIDECAR_URL: "http://127.0.0.1:8081"
    SIDECAR_PORT: "8081"
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/klxhunter42/ai-worker
    tag: ""
    pullPolicy: IfNotPresent
  service:
    metricsPort: 9090
    internalPort: 9091
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"
  env:
    WORKER_CONCURRENCY: "50"
    MAX_RETRIES: "3"
    PROVIDER_RPM_LIMITS: "glm:5,anthropic:40"

rateLimiter:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/klxhunter42/distributed-rate-limiter
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1536Mi"
      cpu: "2"
  env:
    SPRING_PROFILES_ACTIVE: "docker"
    SERVER_PORT: "8080"
    JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+UseStringDeduplication"
    RATELIMITER_CAPACITY: "1000"
    RATELIMITER_REFILLRATE: "100"
    RATELIMITER_ADAPTIVE_ENABLED: "true"
    RATELIMITER_SECURITY_API_KEYS_ENABLED: "false"
    RATELIMITER_SECURITY_IP_WHITELIST: ""
    RATELIMITER_GEOGRAPHIC_ENABLED: "false"

dragonfly:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/dragonflydb/dragonfly
    tag: "v1.37.2"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "8Gi"
      cpu: "2"
  persistence:
    enabled: false
    storageClassName: ""
    size: 20Gi
  args:
    maxMemory: "4gb"
    proactorThreads: 4
    cacheMode: true
    tcpKeepalive: 60
    pipelineSquash: 10

prometheus:
  enabled: true
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: "v2.54.1"
    pullPolicy: IfNotPresent
  service:
    port: 9090
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2"
  retention:
    time: "30d"
    size: "10GB"
  persistence:
    enabled: false
    storageClassName: ""
    size: 50Gi

grafana:
  enabled: true
  replicaCount: 1
  image:
    repository: grafana/grafana
    tag: "11.3.0"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "2"
  persistence:
    enabled: false
    storageClassName: ""
    size: 10Gi
  env:
    GF_LOG_LEVEL: "warn"
    GF_AUTH_ANONYMOUS_ENABLED: "false"
    GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    adminPassword:
      secret: ai-gateway-secrets
      key: grafana-admin-password

presidio:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/klxhunter42/presidio-analyzer
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"

otelCollector:
  enabled: true
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.112.0"
    pullPolicy: IfNotPresent
  service:
    grpcPort: 4317
    httpPort: 4318
    metricsPort: 8889
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "1"

proxy:
  enabled: true
  replicaCount: 1
  image:
    repository: caddy
    tag: "2-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 9000
  resources:
    requests:
      memory: "32Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "500m"

secrets:
  create: true
  # Each value supports string (managed secret) or object (external secret):
  # anthropicApiKeys: "sk-xxx"
  # anthropicApiKeys:
  #   secret: my-vault-secrets
  #   key: anthropic-key
  upstreamApiKeys: ""
  openaiApiKeys: ""
  anthropicApiKeys: ""
  geminiApiKeys: ""
  openrouterApiKeys: ""
  geminiOAuthClientId: ""
  geminiOAuthClientSecret: ""
  grafanaAdminPassword: "devopscore"
  dashboardPassword: "devopscore"

sidecar:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/klxhunter42/ai-sidecar
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
