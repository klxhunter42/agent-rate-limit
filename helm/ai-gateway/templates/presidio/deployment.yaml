{{- if .Values.presidio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "presidio") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "presidio") | nindent 4 }}
spec:
  replicas: {{ .Values.presidio.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "presidio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "presidio") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: presidio
          image: "{{ .Values.presidio.image.repository }}:{{ .Values.presidio.image.tag }}"
          imagePullPolicy: {{ .Values.presidio.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          resources:
            {{- toYaml .Values.presidio.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
{{- end }}
