{{- if .Values.mitmweb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "mitmweb") }}
  namespace: {{ .Values.global.namespace }}
  labels:
{{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "mitmweb") | nindent 4 }}
spec:
  replicas: {{ .Values.mitmweb.replicaCount }}
  selector:
    matchLabels:
{{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "mitmweb") | nindent 6 }}
  template:
    metadata:
      labels:
{{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "mitmweb") | nindent 8 }}
    spec:
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
{{- end }}
      securityContext:
{{- include "ai-gateway.podSecurityContext" . | nindent 8 }}
        runAsUser: 0
      containers:
        - name: mitmweb
          image: "{{ .Values.mitmweb.image.repository }}:{{ .Values.mitmweb.image.tag }}"
          imagePullPolicy: {{ .Values.mitmweb.image.pullPolicy }}
          env:
            - name: MITMWEB_PASS
              valueFrom:
                secretKeyRef:
{{- include "ai-gateway.secretKeyRef" (dict "key" "mitmweb-password" "value" .Values.secrets.mitmwebPassword) | nindent 18 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              ARGS="--set web_port={{ .Values.mitmweb.service.webPort }} --set web_assets_url_prefix=/mitmweb --listen-host 0.0.0.0 --listen-port {{ .Values.mitmweb.service.proxyPort }} --ssl-insecure --web-host 0.0.0.0"
              if [ -n "$MITMWEB_PASS" ]; then
                ARGS="$ARGS --set web_password=$MITMWEB_PASS"
              fi
              exec mitmweb $ARGS
          ports:
            - name: web
              containerPort: {{ .Values.mitmweb.service.webPort }}
            - name: proxy
              containerPort: {{ .Values.mitmweb.service.proxyPort }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CAP_SETUID
                - CAP_SETGID
                - CAP_CHOWN
          resources:
{{- toYaml .Values.mitmweb.resources | nindent 12 }}
{{- end }}
