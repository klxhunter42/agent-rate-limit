{{- if .Values.mitmweb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "mitmweb") }}
  namespace: {{ .Values.global.namespace }}
  labels:
{{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "mitmweb") | nindent 4 }}
spec:
  replicas: {{ .Values.mitmweb.replicaCount }}
  selector:
    matchLabels:
{{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "mitmweb") | nindent 6 }}
  template:
    metadata:
      labels:
{{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "mitmweb") | nindent 8 }}
    spec:
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
{{- end }}
      securityContext:
{{- include "ai-gateway.podSecurityContext" . | nindent 8 }}
        runAsUser: 0
      containers:
        - name: mitmweb
          image: "{{ .Values.mitmweb.image.repository }}:{{ .Values.mitmweb.image.tag }}"
          imagePullPolicy: {{ .Values.mitmweb.image.pullPolicy }}
          env:
            - name: MITMWEB_PASS
              valueFrom:
                secretKeyRef:
{{- include "ai-gateway.secretKeyRef" (dict "key" "mitmweb-password" "value" .Values.secrets.mitmwebPassword) | nindent 18 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec python3 -c "
              import re, mitmproxy.tools.web.app as _app, tornado.web
              _orig_init = _app.Application.__init__
              def _patched_init(self, master, debug):
                  _app.handlers[:] = [(re.sub(r'^(/)', r'/mitmweb\1', p), h) for p, h in _app.handlers] + [(r'/mitmweb', _app.handlers[0][1])]
                  _orig_init(self, master, debug)
                  self.settings['static_url_prefix'] = '/mitmweb/static/'
                  self.add_handlers('.*$', [(r'/mitmweb/static/(.*)', tornado.web.StaticFileHandler, {'path': self.settings['static_path']})])
              _app.Application.__init__ = _patched_init
              from mitmproxy.tools.main import mitmweb
              args = ['--set', 'web_open_browser=false', '--web-port', '{{ .Values.mitmweb.service.webPort }}', '--listen-host', '0.0.0.0', '--listen-port', '{{ .Values.mitmweb.service.proxyPort }}', '--ssl-insecure', '--web-host', '0.0.0.0']
              if '$MITMWEB_PASS':
                args += ['--set', 'web_password=$MITMWEB_PASS']
              mitmweb(args)
              "
          ports:
            - name: web
              containerPort: {{ .Values.mitmweb.service.webPort }}
            - name: proxy
              containerPort: {{ .Values.mitmweb.service.proxyPort }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CAP_SETUID
                - CAP_SETGID
                - CAP_CHOWN
          resources:
{{- toYaml .Values.mitmweb.resources | nindent 12 }}
{{- end }}
