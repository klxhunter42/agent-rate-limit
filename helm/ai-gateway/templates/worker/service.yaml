{{- if .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "worker") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "worker") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.worker.service.metricsPort }}
      targetPort: 9090
      protocol: TCP
      name: metrics
    - port: {{ .Values.worker.service.internalPort }}
      targetPort: 9091
      protocol: TCP
      name: internal
  selector:
    {{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "worker") | nindent 4 }}
{{- end }}
