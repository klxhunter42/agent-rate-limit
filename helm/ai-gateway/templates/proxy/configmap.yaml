{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "proxy") }}
  namespace: {{ .Values.global.namespace }}
  labels:
{{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "proxy") | nindent 4 }}
data:
  Caddyfile: |
    http://:9000 {
      handle /ws {
        reverse_proxy {{ .Release.Name }}-gateway:8080 {
          flush_interval -1
        }
      }
      handle /hmr {
        reverse_proxy {{ .Release.Name }}-gateway:8080 {
          flush_interval -1
        }
      }
      handle /v1/* {
        reverse_proxy {{ .Release.Name }}-gateway:8080 {
          flush_interval -1
        }
      }
      handle /health {
        reverse_proxy {{ .Release.Name }}-gateway:8080
      }
      handle /api/* {
        reverse_proxy {{ .Release.Name }}-gateway:8080 {
          flush_interval -1
        }
      }
      handle /metrics {
        reverse_proxy {{ .Release.Name }}-gateway:8080
      }
      handle /callback {
        reverse_proxy {{ .Release.Name }}-gateway:8080
      }
      @grafana path /grafana /grafana/*
      handle @grafana {
        reverse_proxy {{ .Release.Name }}-grafana:3000
      }
      handle_path /rl/* {
        reverse_proxy {{ .Release.Name }}-rl-dashboard:8080
      }
      handle {
        reverse_proxy {{ .Release.Name }}-gateway:8080
      }
    }
{{- end }}
