{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "postgres") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "postgres") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "postgres") }}-headless
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "postgres") | nindent 4 }}
{{- end }}
