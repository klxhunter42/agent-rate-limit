{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
{{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- $secrets := dict -}}
{{- if kindIs "string" .Values.secrets.upstreamApiKeys }}
  upstream-api-keys: {{ .Values.secrets.upstreamApiKeys | quote }}
{{- end }}
{{- if kindIs "string" .Values.secrets.openaiApiKeys }}
  openai-api-keys: {{ .Values.secrets.openaiApiKeys | quote }}
{{- end }}
{{- if kindIs "string" .Values.secrets.anthropicApiKeys }}
  anthropic-api-keys: {{ .Values.secrets.anthropicApiKeys | quote }}
{{- end }}
{{- if kindIs "string" .Values.secrets.geminiApiKeys }}
  gemini-api-keys: {{ .Values.secrets.geminiApiKeys | quote }}
{{- end }}
{{- if kindIs "string" .Values.secrets.openrouterApiKeys }}
  openrouter-api-keys: {{ .Values.secrets.openrouterApiKeys | quote }}
{{- end }}
{{- if kindIs "string" .Values.secrets.geminiOAuthClientId }}
  gemini-oauth-client-id: {{ .Values.secrets.geminiOAuthClientId | quote }}
{{- end }}
{{- if kindIs "string" .Values.secrets.geminiOAuthClientSecret }}
  gemini-oauth-client-secret: {{ .Values.secrets.geminiOAuthClientSecret | quote }}
{{- end }}
{{- if kindIs "string" .Values.secrets.grafanaAdminPassword }}
  grafana-admin-password: {{ .Values.secrets.grafanaAdminPassword | default "changeme" | quote }}
{{- end }}
{{- end }}
