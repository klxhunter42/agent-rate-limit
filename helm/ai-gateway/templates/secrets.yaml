{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  upstream-api-keys: {{ .Values.secrets.upstreamApiKeys | default "" | quote }}
  glm-api-keys: {{ .Values.secrets.glmApiKeys | default "" | quote }}
  openai-api-keys: {{ .Values.secrets.openaiApiKeys | default "" | quote }}
  anthropic-api-keys: {{ .Values.secrets.anthropicApiKeys | default "" | quote }}
  gemini-api-keys: {{ .Values.secrets.geminiApiKeys | default "" | quote }}
  openrouter-api-keys: {{ .Values.secrets.openrouterApiKeys | default "" | quote }}
  gemini-oauth-client-id: {{ .Values.secrets.geminiOAuthClientId | default "" | quote }}
  gemini-oauth-client-secret: {{ .Values.secrets.geminiOAuthClientSecret | default "" | quote }}
  grafana-admin-password: {{ .Values.secrets.grafanaAdminPassword | default "changeme" | quote }}
  dashboard-api-key: {{ .Values.secrets.dashboardApiKey | default "" | quote }}
{{- end }}
