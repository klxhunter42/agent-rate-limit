{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "prometheus") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'agent-rate-limit'
        replica: '1'

    scrape_configs:
      - job_name: 'api-gateway'
        metrics_path: /metrics
        static_configs:
          - targets: ['{{ .Release.Name }}-gateway.{{ .Values.global.namespace }}.svc.cluster.local:8080']
        scrape_interval: 10s

      - job_name: 'ai-worker'
        static_configs:
          - targets: ['{{ .Release.Name }}-worker.{{ .Values.global.namespace }}.svc.cluster.local:9090']
        scrape_interval: 10s

      - job_name: 'rate-limiter'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['{{ .Release.Name }}-rate-limiter.{{ .Values.global.namespace }}.svc.cluster.local:8080']
        scrape_interval: 10s

      - job_name: 'otel-collector'
        static_configs:
          - targets: ['{{ .Release.Name }}-otel-collector.{{ .Values.global.namespace }}.svc.cluster.local:8889']
        scrape_interval: 10s

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
{{- end }}
