{{- if .Values.rateLimiter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "rate-limiter") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "rate-limiter") | nindent 4 }}
spec:
  replicas: {{ .Values.rateLimiter.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "rate-limiter") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "rate-limiter") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "ai-gateway.podSecurityContext" . | nindent 8 }}
      containers:
        - name: rate-limiter
          image: "{{ .Values.rateLimiter.image.repository }}:{{ .Values.rateLimiter.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.rateLimiter.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            {{- include "ai-gateway.securityContext" . | nindent 12 }}
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: "{{ .Release.Name }}-dragonfly"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            {{- include "ai-gateway.envVars" .Values.rateLimiter.env | nindent 12 }}
          resources:
            {{- toYaml .Values.rateLimiter.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "rate-limiter") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
{{- end }}
