{{- if .Values.sidecar.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.component" (dict "Release" .Release "Chart" .Chart "component" "sidecar") }}
  namespace: {{ .Values.global.namespace }}
  labels:
{{- include "ai-gateway.labels" (dict "Chart" .Chart "Release" .Release "component" "sidecar") | nindent 4 }}
spec:
  replicas: {{ .Values.sidecar.replicaCount }}
  selector:
    matchLabels:
{{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "sidecar") | nindent 6 }}
  template:
    metadata:
      labels:
{{- include "ai-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "sidecar") | nindent 8 }}
    spec:
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
{{- end }}
      securityContext:
{{- include "ai-gateway.podSecurityContext" . | nindent 8 }}
      containers:
      - name: sidecar
        image: "{{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.sidecar.image.pullPolicy }}
        ports:
        - containerPort: 8081
          name: http
        securityContext:
{{- include "ai-gateway.securityContext" . | nindent 12 }}
        env:
        - name: SIDECAR_PORT
          value: "8081"
        - name: ZAI_API_KEYS
          valueFrom:
            secretKeyRef:
{{- include "ai-gateway.secretKeyRef" (dict "key" "upstream-api-keys" "value" .Values.secrets.upstreamApiKeys) | nindent 14 }}
        resources:
{{- toYaml .Values.sidecar.resources | nindent 12 }}
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}
