# =============================================================================
# Multi-Agent AI Rate-Limited System - Production Docker Compose
# Architecture: Client -> API Gateway (Go) -> Rate Limiter -> Dragonfly -> Python Workers -> AI Provider
#
# External ports:  arl-proxy (9000)
# Internal only:   arl-gateway, arl-grafana, arl-rl-dashboard, arl-rate-limiter, arl-dragonfly, arl-worker, arl-prometheus, arl-otel
# =============================================================================

version: "3.9"

x-common-env: &common-env
  REDIS_ADDR: arl-dragonfly:6379
  RATE_LIMITER_ADDR: http://arl-rate-limiter:8080
  QUEUE_NAME: ai_jobs
  OTLP_ENDPOINT: arl-otel:4317

services:
  # --- API Gateway (Go) ---
  arl-gateway:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: arl-gateway
    restart: always
    environment:
      <<: *common-env
      SERVER_PORT: ":8080"
      DASHBOARD_URL: ${DASHBOARD_URL:-https://ai.klxhub.com}
      OAUTH_CALLBACK_BASE: ${OAUTH_CALLBACK_BASE:-https://ai.klxhub.com}
      GLOBAL_RATE_LIMIT: ${GLOBAL_RATE_LIMIT:-100}
      AGENT_RATE_LIMIT: ${AGENT_RATE_LIMIT:-5}
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-100}
      REDIS_POOL_SIZE: "50"
      REDIS_MIN_IDLE_CONNS: "10"
      UPSTREAM_URL: ${UPSTREAM_URL:-https://api.z.ai/api/anthropic}
      STREAM_TIMEOUT: ${STREAM_TIMEOUT:-300s}
      UPSTREAM_MODEL_LIMITS: ${UPSTREAM_MODEL_LIMITS:-glm-5.1:1,glm-5-turbo:1,glm-5:2,glm-4.7:2,glm-4.6:3,glm-4.5:10}
      UPSTREAM_VISION_MODEL_LIMITS: ${UPSTREAM_VISION_MODEL_LIMITS:-glm-5.1:5,glm-4.6v:5,glm-4.5v:3}
      UPSTREAM_DEFAULT_LIMIT: ${UPSTREAM_DEFAULT_LIMIT:-1}
      UPSTREAM_GLOBAL_LIMIT: ${UPSTREAM_GLOBAL_LIMIT:-9}
      UPSTREAM_MAX_RETRIES: ${UPSTREAM_MAX_RETRIES:-5}
      UPSTREAM_RETRY_BACKOFF: ${UPSTREAM_RETRY_BACKOFF:-1s}
      ENABLE_PROMPT_INJECTION: ${ENABLE_PROMPT_INJECTION:-true}
      ENABLE_RESPONSE_TRIM: ${ENABLE_RESPONSE_TRIM:-true}
      ENABLE_SMART_MAX_TOKENS: ${ENABLE_SMART_MAX_TOKENS:-true}
      PROMPT_INJECTION_TEXT: ${PROMPT_INJECTION_TEXT:-}
      ZAI_API_KEYS: ${ZAI_API_KEYS:-${GLM_API_KEYS:-}}
      UPSTREAM_RPM_LIMIT: ${UPSTREAM_RPM_LIMIT:-40}
      UPSTREAM_PROBE_MULTIPLIER: ${UPSTREAM_PROBE_MULTIPLIER:-5}
      MODEL_PRICING: ${MODEL_PRICING:-glm-5.1:1.4:4.4,glm-5-turbo:1.2:4.0,glm-5:1.0:3.2,glm-4.7:0.6:2.2,glm-4.7-flashx:0.07:0.4,glm-4.6:0.6:2.2,glm-4.5:0.6:2.2,glm-4.5-x:2.2:8.9,glm-4.5-air:0.2:1.1,glm-4.5-airx:1.1:4.5,glm-4.6v:0.3:0.9,glm-4.5v:0.6:1.8,claude-opus-4-7:15:75,claude-sonnet-4-6:3:15,claude-sonnet-4-20250514:3:15,claude-haiku-4-5-20251001:0.8:4,claude-opus-4-20250115:15:75}
      PASTEGUARD_ENABLED: ${PASTEGUARD_ENABLED:-true}
      PASTEGUARD_SECRETS_ENABLED: ${PASTEGUARD_SECRETS_ENABLED:-true}
      PASTEGUARD_SECRET_ENTITIES: ${PASTEGUARD_SECRET_ENTITIES:-}
      PASTEGUARD_MAX_SCAN_CHARS: ${PASTEGUARD_MAX_SCAN_CHARS:-200000}
      PASTEGUARD_PII_ENABLED: ${PASTEGUARD_PII_ENABLED:-true}
      PASTEGUARD_PII_ENTITIES: ${PASTEGUARD_PII_ENTITIES:-}
      GEMINI_OAUTH_CLIENT_ID: ${GEMINI_OAUTH_CLIENT_ID:-}
      GEMINI_OAUTH_CLIENT_SECRET: ${GEMINI_OAUTH_CLIENT_SECRET:-}
      GLM_MODE: ${GLM_MODE:-true}
      CLI_SIDECAR_ENABLED: ${CLI_SIDECAR_ENABLED:-true}
      CLI_SIDECAR_URL: ${CLI_SIDECAR_URL:-http://127.0.0.1:8081}
      SIDECAR_PORT: ${SIDECAR_PORT:-8081}
      TEXTCOMP_ENABLED: ${TEXTCOMP_ENABLED:-true}
      TEXTCOMP_MODE: ${TEXTCOMP_MODE:-balanced}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      MITM_PROXY_URL: ${MITM_PROXY_URL:-}
      LOTUSS_UPSTREAM_BASE: ${LOTUSS_UPSTREAM_BASE:-https://llm.internal/custom/llm}
      LOTUSS_API_KEYS: ${LOTUSS_API_KEYS:-}
      UPSTREAM_SKIP_TLS: ${UPSTREAM_SKIP_TLS:-true}
      DEBUG: ${DEBUG:-false}
      SSL_CERT_FILE: /tmp/mitmproxy-ca-cert.pem
    depends_on:
      arl-dragonfly:
        condition: service_healthy
      arl-rate-limiter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - arl-network

  # --- Rate Limiter (Java / Spring Boot) ---
  arl-rate-limiter:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: ./distributed-rate-limiter
      dockerfile: Dockerfile
    container_name: arl-rate-limiter
    restart: always
    expose:
      - "8080"
    environment:
      SPRING_DATA_REDIS_HOST: arl-dragonfly
      SPRING_DATA_REDIS_PORT: 6379
      RATELIMITER_CAPACITY: ${RATE_LIMITER_CAPACITY:-1000}
      RATELIMITER_REFILLRATE: ${RATE_LIMITER_REFILL_RATE:-100}
      RATELIMITER_SECURITY_IP_WHITELIST: ""
      RATELIMITER_SECURITY_API_KEYS_ENABLED: "false"
      RATELIMITER_ADAPTIVE_ENABLED: "true"
      RATELIMITER_GEOGRAPHIC_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+UseStringDeduplication"
    depends_on:
      arl-dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - arl-network

  # --- Dragonfly (Redis-compatible) ---
  arl-dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v1.37.2
    container_name: arl-dragonfly
    restart: always
    expose:
      - "6379"
    command:
      - "--maxmemory=${DRAGONFLY_MAX_MEMORY:-4gb}"
      - "--proactor_threads=4"
      - "--cache_mode=true"

      - "--tcp_keepalive=60"
      - "--pipeline_squash=10"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - arl-dragonfly-data:/data
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - arl-network

  # --- AI Worker (Python) ---
  arl-worker:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: arl-worker
    restart: always
    expose:
      - "9090"
      - "9091"
    environment:
      <<: *common-env
      REDIS_URL: redis://arl-dragonfly:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-50}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      BASE_BACKOFF: ${BASE_BACKOFF:-1.0}
      RESULT_TTL: ${RESULT_TTL:-600}
      METRICS_PORT: "9090"
      GLM_API_KEYS: ${GLM_API_KEYS:-}
      GLM_ENDPOINT: ${GLM_ENDPOINT:-https://api.z.ai/api/anthropic}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      OPENROUTER_API_KEYS: ${OPENROUTER_API_KEYS:-}
      UPSTREAM_MODEL_LIMITS: ${UPSTREAM_MODEL_LIMITS:-glm-5.1:1,glm-5-turbo:1,glm-5:2,glm-4.7:2,glm-4.6:3,glm-4.5:10}
      UPSTREAM_VISION_MODEL_LIMITS: ${UPSTREAM_VISION_MODEL_LIMITS:-glm-5.1:5,glm-4.6v:5,glm-4.5v:3}
      UPSTREAM_DEFAULT_LIMIT: ${UPSTREAM_DEFAULT_LIMIT:-1}
      UPSTREAM_GLOBAL_LIMIT: ${UPSTREAM_GLOBAL_LIMIT:-9}
      PROVIDER_RPM_LIMITS: ${PROVIDER_RPM_LIMITS:-glm:5}
    depends_on:
      arl-dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics-internal"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - arl-network

  # --- Prometheus ---
  arl-prometheus:
    image: prom/prometheus:v2.54.1
    container_name: arl-prometheus
    restart: always
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - arl-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--storage.tsdb.wal-compression"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - arl-network

  # --- Grafana ---
  arl-grafana:
    image: grafana/grafana:11.3.0
    container_name: arl-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_LOG_LEVEL: "warn"
      GF_SERVER_ROOT_URL: ${PROXY_SCHEME:-http}://${EXTERNAL_HOST:-localhost}:${PROXY_PORT:-9000}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DATABASE_BUSY_TIMEOUT: "5000"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/service-dashboard.json
    volumes:
      - arl-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - arl-prometheus
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - arl-network

  # --- OpenTelemetry Collector ---
  arl-otel:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: arl-otel
    restart: always
    expose:
      - "4317"
      - "4318"
      - "8889"
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - arl-network

  # --- Rate Limiter Dashboard (React) ---
  arl-rl-dashboard:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: ./distributed-rate-limiter/examples/web-dashboard
      dockerfile: Dockerfile
    container_name: arl-rl-dashboard
    restart: always
    profiles: ["rl-dashboard"]
    depends_on:
      arl-rate-limiter:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - arl-network

  # --- Presidio PII Analyzer (legacy, replaced by regex; opt-in via --profile pii) ---
  arl-presidio:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    container_name: arl-presidio
    restart: always
    profiles: ["pii"]
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - arl-network

  # --- mitmproxy (always-on, default pass-through) ---
  arl-mitmweb:
    image: mitmproxy/mitmproxy:12.2
    container_name: arl-mitmweb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec python3 -c "
        import re, mitmproxy.tools.web.app as _app, tornado.web
        _orig_init = _app.Application.__init__
        def _patched_init(self, master, debug):
            _app.handlers[:] = [(re.sub(r'^(/)', r'/mitmweb\1', p), h) for p, h in _app.handlers] + [(r'/mitmweb', _app.handlers[0][1])]
            _orig_init(self, master, debug)
            self.settings['static_url_prefix'] = '/mitmweb/static/'
            self.add_handlers('.*$', [(r'/mitmweb/static/(.*)', tornado.web.StaticFileHandler, {'path': self.settings['static_path']})])
        _app.Application.__init__ = _patched_init
        from mitmproxy.tools.main import mitmweb
        mitmweb(['--set', 'web_password=test', '--web-port', '8081', '--listen-host', '0.0.0.0', '--listen-port', '8083', '--ssl-insecure', '--web-host', '0.0.0.0', '--set', 'web_open_browser=false'])
        "
    networks:
      - arl-network

  # --- Claude Code debug client (start with: docker compose --profile debug up) ---
  claude-code-debug:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: ./docker
      dockerfile: Dockerfile.claude-code
    container_name: claude-code-debug
    profiles: ["debug"]
    volumes:
      - ./workspace:/workspace
      - ./docker/settings-debug.json:/home/claude/.claude/settings.json
    environment:
      PROFILE_NAME: claude
      DEFAULT_MODEL: claude-sonnet-4-6
      HTTPS_PROXY: http://arl-mitmweb:8083
      HTTP_PROXY: http://arl-mitmweb:8083
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
      CLAUDE_CODE_DISABLE_ANALYTICS: 1
    depends_on:
      arl-gateway:
        condition: service_healthy
      arl-mitmweb:
        condition: service_started
    networks:
      - arl-network
    stdin_open: true
    tty: true

  # --- Central Proxy (Caddy) ---
  arl-proxy:
    image: caddy:2-alpine
    container_name: arl-proxy
    restart: always
    ports:
      - "${PROXY_PORT:-9000}:${PROXY_PORT:-9000}"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      PROXY_HOST: "0.0.0.0"
      PROXY_PORT: "${PROXY_PORT:-9000}"
    depends_on:
      arl-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - arl-network

networks:
  arl-network:
    driver: bridge

volumes:
  arl-dragonfly-data:
  arl-prometheus-data:
  arl-grafana-data:
