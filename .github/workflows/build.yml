name: Build & Push Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            ctx: ./api-gateway
            file: Dockerfile
            img: ai-gateway
          - name: worker
            ctx: ./ai-worker
            file: Dockerfile
            img: ai-worker
          - name: rate-limiter
            ctx: ./distributed-rate-limiter
            file: Dockerfile
            img: distributed-rate-limiter
          - name: dashboard
            ctx: ./ui
            file: Dockerfile.dev
            img: ai-dashboard
          - name: rl-dashboard
            ctx: ./distributed-rate-limiter/examples/web-dashboard
            file: Dockerfile
            img: ai-rl-dashboard
          - name: sidecar
            ctx: ./api-gateway/sidecar
            file: Dockerfile
            img: ai-sidecar
    name: ${{ matrix.name }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.img }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{date 'YYYY.MM.DD'}}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.ctx }}
          file: ${{ matrix.ctx }}/${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
