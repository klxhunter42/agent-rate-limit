name: Build & Push Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (blank = all)'
        required: false
        default: ''

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      worker: ${{ steps.filter.outputs.worker }}
      rate-limiter: ${{ steps.filter.outputs.rate-limiter }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      rl-dashboard: ${{ steps.filter.outputs.rl-dashboard }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - api-gateway/**
              - ui/**
            worker:
              - ai-worker/**
            rate-limiter:
              - distributed-rate-limiter/**
            dashboard:
              - ui/**
            rl-dashboard:
              - distributed-rate-limiter/examples/web-dashboard/**
            sidecar:
              - api-gateway/sidecar/**

  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            ctx: .
            file: api-gateway/Dockerfile
            img: ai-gateway
            changed: ${{ needs.changes.outputs.gateway == 'true' }}
          - name: worker
            ctx: ./ai-worker
            file: Dockerfile
            img: ai-worker
            changed: ${{ needs.changes.outputs.worker == 'true' }}
          - name: rate-limiter
            ctx: ./distributed-rate-limiter
            file: Dockerfile
            img: distributed-rate-limiter
            changed: ${{ needs.changes.outputs.rate-limiter == 'true' }}
          - name: dashboard
            ctx: ./ui
            file: Dockerfile.dev
            img: ai-dashboard
            changed: ${{ needs.changes.outputs.dashboard == 'true' }}
          - name: rl-dashboard
            ctx: ./distributed-rate-limiter/examples/web-dashboard
            file: Dockerfile
            img: ai-rl-dashboard
            changed: ${{ needs.changes.outputs.rl-dashboard == 'true' }}
          - name: sidecar
            ctx: ./api-gateway/sidecar
            file: Dockerfile
            img: ai-sidecar
            changed: ${{ needs.changes.outputs.sidecar == 'true' }}
    if: matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.service == '' || inputs.service == matrix.name)) || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.img }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{date 'YYYY.MM.DD'}}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.ctx }}
          file: ${{ matrix.ctx }}/${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
