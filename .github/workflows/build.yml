name: Build & Push Images

on:
 push:
 branches: [main]
 tags: ['v*']
 workflow_dispatch:
 inputs:
 service:
 description: 'Service to build (blank = all)'
 required: false
 default: ''

concurrency:
 group: build-images-${{ github.ref }}
 cancel-in-progress: true

env:
 REGISTRY: ghcr.io
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
 build:
 runs-on: ubuntu-latest
 strategy:
 fail-fast: false
 matrix:
 include:
 - name: gateway
 ctx: .
 file: api-gateway/Dockerfile
 img: ai-gateway
 paths: "api-gateway/**\nui/**"
 - name: worker
 ctx: ./ai-worker
 file: Dockerfile
 img: ai-worker
 paths: "ai-worker/**"
 - name: rate-limiter
 ctx: ./distributed-rate-limiter
 file: Dockerfile
 img: distributed-rate-limiter
 paths: "distributed-rate-limiter/**"
 - name: dashboard
 ctx: ./ui
 file: Dockerfile.dev
 img: ai-dashboard
 paths: "ui/**"
 - name: rl-dashboard
 ctx: ./distributed-rate-limiter/examples/web-dashboard
 file: Dockerfile
 img: ai-rl-dashboard
 paths: "distributed-rate-limiter/examples/web-dashboard/**"
 - name: sidecar
 ctx: ./api-gateway/sidecar
 file: Dockerfile
 img: ai-sidecar
 paths: "api-gateway/sidecar/**"
 name: ${{ matrix.name }}
 permissions:
 packages: write
 contents: read
 steps:
 - uses: actions/checkout@v5

 - name: Detect changes
 id: changes
 uses: dorny/paths-filter@v3
 with:
 filters: |
 src:
 - ${{ matrix.paths }}

 - name: Skip if no changes and not manual
 id: skip
 run: |
 if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.service }}" ]]; then
 if [[ "${{ inputs.service }}" != "${{ matrix.name }}" ]]; then
 echo "skip=true" >> "$GITHUB_OUTPUT"
 fi
 elif [[ "${{ steps.changes.outputs.src }}" != "true" ]]; then
 echo "skip=true" >> "$GITHUB_OUTPUT"
 fi

 - name: Docker meta
 if: steps.skip.outputs.skip != 'true'
 id: meta
 uses: docker/metadata-action@v6
 with:
 images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.img }}
 tags: |
 type=semver,pattern={{version}}
 type=semver,pattern={{major}}.{{minor}}
 type=raw,value={{date 'YYYY.MM.DD'}}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
 type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

 - uses: docker/setup-buildx-action@v4
 if: steps.skip.outputs.skip != 'true'

 - uses: docker/login-action@v4
 if: steps.skip.outputs.skip != 'true'
 with:
 registry: ${{ env.REGISTRY }}
 username: ${{ github.actor }}
 password: ${{ secrets.GITHUB_TOKEN }}

 - uses: docker/build-push-action@v7
 if: steps.skip.outputs.skip != 'true'
 with:
 context: ${{ matrix.ctx }}
 file: ${{ matrix.ctx }}/${{ matrix.file }}
 push: true
 platforms: linux/amd64,linux/arm64
 tags: ${{ steps.meta.outputs.tags }}
 labels: ${{ steps.meta.outputs.labels }}
 cache-from: type=gha
 cache-to: type=gha,mode=max
