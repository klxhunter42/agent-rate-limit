name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            ctx: ./api-gateway
            file: Dockerfile
            img: ai-gateway
          - name: worker
            ctx: ./ai-worker
            file: Dockerfile
            img: ai-worker
          - name: rate-limiter
            ctx: ./distributed-rate-limiter
            file: Dockerfile
            img: distributed-rate-limiter
          - name: dashboard
            ctx: ./ui
            file: Dockerfile.dev
            img: ai-dashboard
          - name: rl-dashboard
            ctx: ./distributed-rate-limiter/examples/web-dashboard
            file: Dockerfile
            img: ai-rl-dashboard
          - name: sidecar
            ctx: ./api-gateway/sidecar
            file: Dockerfile
            img: ai-sidecar
    name: ${{ matrix.name }}
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.ctx }}
          file: ${{ matrix.ctx }}/${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.img }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.img }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
