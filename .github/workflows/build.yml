name: Build & Push Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (blank = all)'
        required: false
        default: ''

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      worker: ${{ steps.filter.outputs.worker }}
      rate-limiter: ${{ steps.filter.outputs.rate-limiter }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      rl-dashboard: ${{ steps.filter.outputs.rl-dashboard }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect changes
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger: mark all as changed, build job handles filtering
            echo "gateway=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "rate-limiter=true" >> "$GITHUB_OUTPUT"
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
            echo "rl-dashboard=true" >> "$GITHUB_OUTPUT"
            echo "sidecar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push: build everything
            echo "gateway=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "rate-limiter=true" >> "$GITHUB_OUTPUT"
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
            echo "rl-dashboard=true" >> "$GITHUB_OUTPUT"
            echo "sidecar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Push to main: detect changed paths
          DIFF=$(git diff --name-only HEAD~1 HEAD)
          check() {
            local pattern="$1"
            if echo "$DIFF" | grep -qE "$pattern"; then echo "true"; else echo "false"; fi
          }
          echo "gateway=$(check '^(api-gateway|ui)/')" >> "$GITHUB_OUTPUT"
          echo "worker=$(check '^ai-worker/')" >> "$GITHUB_OUTPUT"
          echo "rate-limiter=$(check '^distributed-rate-limiter/')" >> "$GITHUB_OUTPUT"
          echo "dashboard=$(check '^ui/')" >> "$GITHUB_OUTPUT"
          echo "rl-dashboard=$(check '^distributed-rate-limiter/examples/web-dashboard/')" >> "$GITHUB_OUTPUT"
          echo "sidecar=$(check '^api-gateway/sidecar/')" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            ctx: .
            file: api-gateway/Dockerfile
            img: ai-gateway
            changed: ${{ needs.changes.outputs.gateway == 'true' }}
          - name: worker
            ctx: ./ai-worker
            file: Dockerfile
            img: ai-worker
            changed: ${{ needs.changes.outputs.worker == 'true' }}
          - name: rate-limiter
            ctx: ./distributed-rate-limiter
            file: Dockerfile
            img: distributed-rate-limiter
            changed: ${{ needs.changes.outputs.rate-limiter == 'true' }}
          - name: dashboard
            ctx: ./ui
            file: Dockerfile.dev
            img: ai-dashboard
            changed: ${{ needs.changes.outputs.dashboard == 'true' }}
          - name: rl-dashboard
            ctx: ./distributed-rate-limiter/examples/web-dashboard
            file: Dockerfile
            img: ai-rl-dashboard
            changed: ${{ needs.changes.outputs.rl-dashboard == 'true' }}
          - name: sidecar
            ctx: ./api-gateway/sidecar
            file: Dockerfile
            img: ai-sidecar
            changed: ${{ needs.changes.outputs.sidecar == 'true' }}
    steps:
      - name: Should build?
        id: should_build
        run: |
          skip=true
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            skip=false
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            svc="${{ inputs.service }}"
            if [[ -z "$svc" ]] || [[ "$svc" == "${{ matrix.name }}" ]]; then skip=false; fi
          elif [[ "${{ matrix.changed }}" == "true" ]]; then
            skip=false
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.should_build.outputs.skip != 'true'

      - name: Docker meta
        if: steps.should_build.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.img }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{date 'YYYY.MM.DD'}}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4
        if: steps.should_build.outputs.skip != 'true'

      - uses: docker/login-action@v4
        if: steps.should_build.outputs.skip != 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.should_build.outputs.skip != 'true'
        with:
          context: ${{ matrix.ctx }}
          file: ${{ matrix.ctx }}/${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
